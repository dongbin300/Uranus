# 건설 재료: 시멘트·콘크리트, 석고, 점토 제품과 도자기, 판유리, 아스팔트, 목재와 종이, 창호·철물.
# 광물은 순수 광물의 화학식을 단다(고령석 Al2Si2O5(OH)4). 시멘트·콘크리트 같은 혼합물은 화학식 없이
# 레시피에 적힌 구성 입자 하나를 1로 센다. 부품(개수 단위)은 실제 제품 질량을 expected_mass로 적는다.
category: construction
unit: particle
items:
  # 광물과 원료
