  - { id: gypsum, name: { ko: 석고, en: Gypsum }, category: mineral, formula: CaSO4·2H2O, note: 이수 석고. 시멘트 응결 조절제와 석고보드의 원료 }
  - { id: gravel, name: { ko: 자갈, en: Gravel }, category: mineral, formula: SiO2, note: 콘크리트용 굵은 골재(5~25mm). 석영질 강자갈이라 화학식은 SiO2로 근사한다 }
  - { id: roundwood, name: { ko: 원목, en: Roundwood }, formula: C6H9O4·4H2O, note: "갓 벤 침엽수 원목. 건조 목재 조성(C 49.7 · H 6.2 · O 44.1wt%)을 C6H9O4로 근사하고 함수율(건량 기준) 약 50%를 물 4분자로 나타냈다" }

