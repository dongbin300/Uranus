# 유기·석유화학 물질.
# 이미 있는 작은 분자(CH4, C2H4, C6H6, CH3OH, CH3COOH, CH2O ...)는 화학식 ID를 그대로 쓴다.
# 새 유기 화합물은 이성질체가 분자식을 공유하므로 영문 이름(snake_case)을 ID로 쓰고 분자식을 formula에 적는다.
# 석유 유분은 조성이 일정하지 않은 혼합물이라 화학식이 없다. 한 단위를 평균 분자 하나로 보고,
# 노트의 평균 분자량으로 수율(질량 기준)을 맞췄다. 원유 한 단위는 평균 분자량 약 200으로 잡았다.
category: organic
unit: particle
items:
  # 석유 유분 (혼합물)
  - { id: naphtha, name: { ko: 나프타, en: Naphtha }, note: "끓는점 30~180°C의 C5~C10 탄화수소 혼합물. 평균 분자량 약 100. 석유화학의 주원료" }
  - { id: kerosene, name: { ko: 등유, en: Kerosene }, note: "끓는점 180~240°C의 C10~C16 유분. 평균 분자량 약 165. 정제하면 항공유가 된다" }
  - { id: diesel, name: { ko: 경유, en: Diesel }, note: "끓는점 240~350°C의 C14~C20 유분. 평균 분자량 약 240" }
  - { id: gasoline, name: { ko: 휘발유, en: Gasoline }, note: "C5~C10 혼합물. 평균 분자량 약 100" }
  - { id: atmospheric_residue, name: { ko: 상압 잔사유, en: Atmospheric residue }, note: "상압 증류탑 바닥에 남는 350°C 이상 유분. 평균 분자량 약 550" }
  - { id: vacuum_gas_oil, name: { ko: 감압 경유, en: Vacuum gas oil }, note: "감압 증류로 얻는 350~550°C 유분. 평균 분자량 약 400" }
  - { id: vacuum_residue, name: { ko: 감압 잔사유, en: Vacuum residue }, note: "550°C 이상 중질 유분. 평균 분자량 약 900" }
  - { id: reformate, name: { ko: 개질유, en: Reformate }, note: "접촉 개질로 방향족이 60% 넘게 늘어난 고옥테인가 유분. 평균 분자량 약 100" }
  - { id: pyrolysis_gasoline, name: { ko: 열분해 가솔린, en: Pyrolysis gasoline }, note: "나프타 분해로의 C5~C9 부산물. 벤젠 약 35%. 평균 분자량 약 90" }
  - { id: lubricating_oil, name: { ko: 윤활유 기유, en: Lubricating base oil }, note: "C25~C35 포화 탄화수소. 평균 분자량 약 450" }
