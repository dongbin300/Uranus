# 의약품과 의료 소모품.
# 원료 의약품(API)과 중간체는 분자식을 쓰고, 정제·캡슐·주사제·소모품은 실제 제품 질량의 부품이다.
# 제형 한 개에 든 API 분자 수 = 함량 ÷ 몰 질량 × 아보가드로 수 (예: 아스피린 500mg = 1.671e21 분자).
# 발효 의약품은 생산 균주(세포)를 넣고 1L 배양 한 번 분량을 얻은 뒤 균주를 돌려받는다.
# 마약류·향정신성 의약품과 그 전구체는 다루지 않는다.
category: medicine
