# 전자 부품.
category: electronics
recipes:
  - id: ccd_gate_oxidation
    name: { ko: 게이트 산화 }
    time: 120
    in: { wafer_8in: 1, O2: 7e19 }
    out: { oxidized_wafer: 1 }
    note: 웨이퍼 표면에 약 100nm 열산화막을 기른다
  - id: ccd_gate_deposition
    name: { ko: 폴리실리콘 게이트 증착 }
    time: 180
    in: { oxidized_wafer: 1, Si: 1.4e21 }
    out: { gated_wafer: 1 }
    note: 3상 CCD 게이트용 폴리실리콘 약 300nm × 3층
  - id: ccd_lithography
    name: { ko: 포토리소그래피·이온 주입 }
    time: 600
    in: { gated_wafer: 1, B: 3e15, P: 3e15, plastic: 5e20 }
    out: { patterned_wafer: 1 }
    note: 감광막으로 화소 207만 개와 전송 채널을 새기고 붕소·인을 주입한다
  - id: ccd_metallization
    name: { ko: 금속 배선 }
    time: 240
    in: { patterned_wafer: 1, Al: 5.7e20 }
    out: { ccd_wafer: 1 }
  - id: ccd_dicing
    name: { ko: 웨이퍼 절단 }
    time: 60
    in: { ccd_wafer: 1 }
    out: { ccd_die: 300 }
    note: 화소 5µm 기준 다이 약 9.6×5.4mm, 8인치 웨이퍼 한 장에서 약 300개
  - id: ccd
    name: { ko: CCD 패키징 }
    time: 60
    in: { ccd_die: 1, optical_window: 1, ceramic: 1e22, Cu: 2e21 }
    out: { ccd: 1 }
    note: 세라믹 패키지에 다이를 붙이고 구리 리드를 연결한 뒤 광학 창으로 덮는다
  - id: ccd_camera
    time: 120
    in: { ccd: 1, output_amplifier: 1, clock_generator: 1, clock_distributor: 1, sequencer: 1, multiplexer: 1, trigger_sync_circuit: 1, signal_conditioning_circuit: 4, control_register: 4, bias_voltage_generator: 1, analog_signal_processor: 1, control_circuit: 1, temperature_control_system: 1, communication_interface: 1 }
    out: { ccd_camera: 1 }
    note: 원래 CCD 레시피에 있던 구동·신호 처리 부품. 화소·전송 게이트·시프트 레지스터는 칩 공정 안으로 들어갔다
  - id: wafer_8in
    time: 120
    in: { Si: 1.133e24, SiO2: 1.81e16 }
    out: { wafer_8in: 1 }
  - id: photodiode
    time: 1
    in: { photodiode_junction: 1, InGaAs: 1e18, optical_window: 1, ar_coating: 1, pn_junction: 1, metal_contact: 1 }
    out: { photodiode: 1 }
  - id: photodiode_junction
    time: 1
    in: { Si: 1e17, GaAs: 1e17 }
    out: { photodiode_junction: 1 }
  - id: optical_window
    time: 5
    in: { glass: 1, ar_coating: 1, window_holder: 1 }
    out: { optical_window: 1 }
  - id: ar_coating
    time: 2
    in: { SiO2: 2.2e14 }
    out: { ar_coating: 1 }
  - id: window_holder
    time: 2
    in: { Al: 2.7e16 }
    out: { window_holder: 1 }
  - id: glass
    time: 5
    in: { SiO2: 3.06e20 }
    out: { glass: 1 }
  - id: pn_junction
    time: 1
    in: { p_type_semiconductor: 1, n_type_semiconductor: 1 }
    out: { pn_junction: 1 }
  - id: p_type_semiconductor
    time: 1
    in: { Si: 1e17, B: 1e17 }
    out: { p_type_semiconductor: 1 }
  - id: n_type_semiconductor
    time: 1
    in: { Si: 1e17, P: 1e17 }
    out: { n_type_semiconductor: 1 }
  - id: metal_contact
    time: 1
    in: { Al: 1e17 }
    out: { metal_contact: 1 }
  - id: transfer_gate
    time: 1
    in: { Si: 1e16, insulating_layer: 1, metal_electrode: 1, gate_oxide: 1 }
    out: { transfer_gate: 1 }
  - id: insulating_layer
    time: 1
    in: { SiO2: 3.01e22 }
    out: { insulating_layer: 1 }
  - id: metal_electrode
    time: 1
    in: { Al: 6.022e22 }
    out: { metal_electrode: 1 }
  - id: gate_oxide
    time: 1
    in: { SiO2: 2.19e22 }
    out: { gate_oxide: 1 }
  - id: shift_register
    time: 5
    in: { flip_flop: 8, clock_circuit: 1, control_circuit: 1 }
    out: { shift_register: 1 }
  - id: output_amplifier
    time: 4
    in: { transistor: 4, resistor: 2, capacitor: 2, power_supply_circuit: 1 }
    out: { output_amplifier: 1 }
  - id: clock_generator
    time: 5
    in: { oscillator: 1, amplifier: 2, filter: 1, resistor: 4, capacitor: 4 }
    out: { clock_generator: 1 }
  - id: clock_distributor
    time: 6
    in: { clock_buffer: 2, amplifier: 2, buffer_driver: 2, resistor: 4, capacitor: 4 }
    out: { clock_distributor: 1 }
  - id: sequencer
    time: 7
    in: { counter: 4, flip_flop: 8, clock_circuit: 1, logic_gate: 6, control_circuit: 1 }
    out: { sequencer: 1 }
  - id: multiplexer
    time: 5
    in: { logic_gate: 8, diode: 4, switch: 2, control_circuit: 1 }
    out: { multiplexer: 1 }
  - id: trigger_sync_circuit
    time: 6
    in: { flip_flop: 4, logic_gate: 6, clock_circuit: 1, control_circuit: 1 }
    out: { trigger_sync_circuit: 1 }
  - id: signal_conditioning_circuit
    time: 5
    in: { amplifier: 2, filter: 3, resistor: 4, capacitor: 4 }
    out: { signal_conditioning_circuit: 1 }
  - id: control_register
    time: 4
    in: { flip_flop: 4, logic_gate: 6, resistor: 2 }
    out: { control_register: 1 }
  - id: bias_voltage_generator
    time: 6
    in: { voltage_regulator: 2, transistor: 4, resistor: 4, capacitor: 2 }
    out: { bias_voltage_generator: 1 }
  - id: analog_signal_processor
    time: 7
    in: { op_amp: 4, filter: 3, resistor: 4, capacitor: 4 }
    out: { analog_signal_processor: 1 }
  - id: control_circuit
    time: 5
    in: { microcontroller: 1, logic_gate: 6, resistor: 4 }
    out: { control_circuit: 1 }
  - id: temperature_control_system
    time: 8
    in: { temperature_sensor: 2, heater: 2, fan: 2, thermostat: 1, transistor: 2, resistor: 3 }
    out: { temperature_control_system: 1 }
  - id: communication_interface
    time: 6
    in: { transceiver: 2, microcontroller: 1, logic_gate: 4, resistor: 4 }
    out: { communication_interface: 1 }
  - id: flip_flop
    time: 4
    in: { transistor: 4, resistor: 4, capacitor: 2 }
    out: { flip_flop: 1 }
  - id: clock_circuit
    time: 5
    in: { oscillator: 1, transistor: 2, resistor: 4, capacitor: 3 }
    out: { clock_circuit: 1 }
  - id: power_supply_circuit
    time: 6
    in: { voltage_regulator: 2, transistor: 4, resistor: 4, capacitor: 3 }
    out: { power_supply_circuit: 1 }
  - id: oscillator
    time: 20
    in: { crystal: 1, transistor: 2, resistor: 4, capacitor: 3 }
    out: { oscillator: 1 }
  - id: amplifier
    time: 5
    in: { transistor: 4, resistor: 4, capacitor: 3 }
    out: { amplifier: 1 }
  - id: filter
    time: 4
    in: { resistor: 4, capacitor: 4, inductor: 2 }
    out: { filter: 1 }
  - id: crystal
    time: 86
    in: { SiO2: 3e20 }
    out: { crystal: 1 }
    note: 수정 진동자 블랭크 약 30mg. 원본 3e24(약 300g)는 1만 배 컸다
  - id: resistor
    time: 6
    in: { C: 2.5e21, Cu: 1.2e21, ceramic: 6e20 }
    out: { resistor: 1 }
  - id: capacitor
    time: 10
    in: { Al: 6.3e21, Cu: 2.5e21, ceramic: 1.8e21, electrolyte: 4.5e21 }
    out: { capacitor: 1 }
  - id: clock_buffer
    time: 12
    in: { transistor: 5, resistor: 8, capacitor: 6, Si: 3.8e22, Cu: 1.5e22 }
    out: { clock_buffer: 1 }
  - id: counter
    time: 15
    in: { flip_flop: 9, logic_gate: 12, resistor: 8, Si: 6.5e22, Cu: 3.2e22 }
    out: { counter: 1 }
  - id: buffer_driver
    time: 10
    in: { transistor: 8, resistor: 6, capacitor: 5, Si: 5e22, Cu: 2.3e22 }
    out: { buffer_driver: 1 }
  - id: logic_gate
    time: 8
    in: { transistor: 6, resistor: 7, diode: 4, Si: 3e22, Cu: 1.4e22 }
    out: { logic_gate: 1 }
  - id: diode
    time: 5
    in: { Si: 2e22, Cu: 9e21 }
    out: { diode: 1 }
  - id: switch
    time: 8
    in: { Fe: 7e22, plastic: 5e22, Cu: 3e22 }
    out: { switch: 1 }
  - id: transistor
    time: 3
    in: { n_type_semiconductor: 2, p_type_semiconductor: 1, metal_contact: 3, plastic: 2e21 }
    out: { transistor: 1 }
    note: NPN 양극성 트랜지스터와 수지 패키지
  - id: inductor
    time: 3
    in: { Cu: 5e21, Fe: 1e21 }
    out: { inductor: 1 }
  - id: op_amp
    time: 8
    in: { transistor: 20, resistor: 12, capacitor: 1 }
    out: { op_amp: 1 }
    note: μA741 연산 증폭기는 트랜지스터 20개로 이루어진다
  - id: voltage_regulator
    time: 8
    in: { transistor: 20, resistor: 10, capacitor: 2, diode: 2 }
    out: { voltage_regulator: 1 }
  - id: mcu_lithography
    name: { ko: MCU 포토리소그래피·이온 주입 }
    time: 900
    in: { gated_wafer: 1, B: 5e15, P: 5e15, plastic: 1e21 }
    out: { mcu_patterned_wafer: 1 }
    note: 트랜지스터 약 2만 개짜리 8비트 MCU 회로를 새긴다
  - id: mcu_metallization
    name: { ko: MCU 금속 배선 }
    time: 300
    in: { mcu_patterned_wafer: 1, Al: 1e21 }
    out: { mcu_wafer: 1 }
  - id: mcu_dicing
    name: { ko: MCU 웨이퍼 절단 }
    time: 60
    in: { mcu_wafer: 1 }
    out: { mcu_die: 1000 }
    note: 다이 약 3×3mm, 8인치 웨이퍼 한 장에서 약 1,000개 (가장자리 손실 포함)
  - id: microcontroller
    name: { ko: MCU 패키징 }
    time: 30
    in: { mcu_die: 1, plastic: 5e21, Cu: 3e21 }
    out: { microcontroller: 1 }
    note: 에폭시 패키지와 구리 리드 프레임
  - id: transceiver
    time: 10
    in: { op_amp: 2, oscillator: 1, transistor: 10, inductor: 2, capacitor: 4 }
    out: { transceiver: 1 }
  - id: temperature_sensor
    time: 3
    in: { ceramic: 1e21, metal_contact: 2 }
    out: { temperature_sensor: 1 }
    note: 서미스터(세라믹 저항체)
  - id: thermostat
    time: 6
    in: { temperature_sensor: 1, op_amp: 1, switch: 1, resistor: 4 }
    out: { thermostat: 1 }
  - id: fan
    time: 8
    in: { inductor: 4, Fe: 1e22, plastic: 5e22 }
    out: { fan: 1 }
  - id: heater
    time: 4
    in: { Fe: 1e22, ceramic: 1e21, metal_contact: 2 }
    out: { heater: 1 }
