    in: { metallic_hydrogen: 6e23, Cu: 1e22, Ca: 1e21 }
    out: { rt_superconductor: 1 }
  - id: programmable_matter
    time: 900
    in: { microcontroller: 20, rt_superconductor: 5, protein: 1e18 }
    out: { programmable_matter: 1 }
  - id: molecular_assembler
    time: 1800
    in: { programmable_matter: 1, ribosome_50s: 1e6, ribosome_30s: 1e6, transistor: 100 }
