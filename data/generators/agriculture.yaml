# 농장·목장·어장. 살아 있는 것을 키워 수확한다. 밭은 식물 세포, 가축과 물고기는 동물 세포에서 시작한다.
# 수확량은 실제 면적당 연간 수확량에 비례한다: 0.01개/초 ≈ 1t/ha·년(밭 하나가 약 300ha).
generators:
  - id: wheat_field
    name: { ko: 밀밭, en: Wheat field }
    build: { time: 120, in: { plant_cell: 1, H2O: 4000, urea: 300, KCl: 100, H3PO4: 80, CaCO3: 150, Fe: 200 } }
    produces: { wheat_1kg: 0.035 }
    note: "세계 평균 약 3.5t/ha. 식물 세포 하나를 조직 배양해 첫 모종을 얻는다(전형성능)"
  - id: rice_paddy
    name: { ko: 논, en: Rice paddy }
    build: { time: 150, in: { plant_cell: 1, H2O: 12000, urea: 300, KCl: 120, H3PO4: 80, SiO2: 100, Fe: 200 } }
    produces: { paddy_rice_1kg: 0.047, barley_1kg: 0.03 }
    note: "여름에 벼(약 4.7t/ha), 겨울에 보리(약 3t/ha)를 기르는 이모작 논. 벼는 규산질 비료를 많이 먹는다"
  - id: corn_soybean_field
    name: { ko: 옥수수·콩 돌려짓기 밭, en: Corn-soybean rotation field }
    build: { time: 150, in: { plant_cell: 1, H2O: 6000, urea: 400, KCl: 150, H3PO4: 100, CaCO3: 150, Fe: 300 } }
    produces: { corn_1kg: 0.03, soybean_1kg: 0.014 }
    note: "옥수수(약 6t/ha)와 콩(약 2.8t/ha)을 해마다 번갈아 심는다. 콩의 뿌리혹균이 질소를 고정해 옥수수 비료를 아낀다"
  - id: potato_field
    name: { ko: 감자밭, en: Potato field }
    build: { time: 120, in: { plant_cell: 1, H2O: 5000, urea: 250, KCl: 300, H3PO4: 120, Fe: 200 } }
    produces: { potato_1kg: 0.21 }
    note: "약 21t/ha. 칼륨을 많이 먹는다"
  - id: sugarcane_field
    name: { ko: 사탕수수밭, en: Sugarcane field }
    build: { time: 180, in: { plant_cell: 1, H2O: 15000, urea: 400, KCl: 250, H3PO4: 80, Fe: 300 } }
    produces: { sugarcane_1kg: 0.5 }
    note: "실제로는 약 70t/ha로 가장 수확량이 많은 작물"
  - id: fruit_orchard
    name: { ko: 과수원, en: Fruit orchard }
    build: { time: 240, in: { plant_cell: 1, H2O: 8000, urea: 200, KCl: 150, Ca(OH)2: 100, Cu: 50, Fe: 400 } }
    produces: { apple_1kg: 0.15, grape_1kg: 0.05 }
    note: "사과밭(약 30t/ha)과 포도밭(약 10t/ha)을 함께 가꾼다. 구리는 보르도액(살균제), 철은 지주와 철사"
  - id: cocoa_plantation
    name: { ko: 카카오 농장, en: Cocoa plantation }
    build: { time: 240, in: { plant_cell: 1, H2O: 10000, urea: 150, KCl: 200, CaCO3: 100, Cu: 40, Fe: 150 } }
    produces: { cocoa_beans_1kg: 0.005 }
    note: "약 0.5t/ha. 열매를 쪼개 콩을 일주일 발효시킨 뒤 햇볕에 말린다"
  - id: dairy_farm
    name: { ko: 낙농장, en: Dairy farm }
    build: { time: 300, in: { animal_cell: 1, H2O: 20000, starch: 3000, cellulose: 3000, NaCl: 300, Fe: 1000, Cu: 100 } }
    produces: { raw_milk_1l: 0.05 }
    note: "젖소 약 150마리(한 마리 연 1만L). 첫 소는 동물 세포에서 체세포 복제로 얻는다. 녹말은 곡물 사료, 셀룰로스는 풀 사료"
  - id: poultry_farm
    name: { ko: 양계장, en: Poultry farm }
    build: { time: 240, in: { animal_cell: 1, H2O: 10000, starch: 2000, CaCO3: 500, NaCl: 100, Fe: 800 } }
    produces: { egg: 0.1, whole_chicken: 0.03, chicken_feathers_1kg: 0.005 }
    note: "산란계 약 1만 마리(한 마리 연 300개)와 육계 연 약 100만 마리. 탄산 칼슘은 달걀 껍데기 재료"
  - id: fishery
    name: { ko: 어장, en: Fishery }
    build: { time: 300, in: { animal_cell: 1, Fe: 1500, Cu: 200, plastic: 300, petroleum: 500 } }
    produces: { whole_fish_1kg: 0.05 }
    note: "동물 세포에서 키운 치어를 바다에 풀고, 트롤 어선 한 척이 연 약 1,500t을 잡는다. 플라스틱은 그물, 석유는 연료"
